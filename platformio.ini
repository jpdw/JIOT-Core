; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp8285]
platform = espressif8266
board = esp8285
framework = arduino
lib_deps =
	knolleary/PubSubClient@^2.8
	lennarthennigs/ESP Telnet@^2.3.0
	bblanchon/ArduinoJson@^7

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	knolleary/PubSubClient@^2.8
	lennarthennigs/ESP Telnet@^2.3.0
	bblanchon/ArduinoJson@^7

; Real-hardware target: a genuine Wemos/Lolin D1 Mini, used for on-device
; testing of examples/minimal.cpp. Deliberately board=d1_mini (not esp8285)
; to match the actual physical chip/flash config - see effects_controller's
; debugging history for why that distinction matters on real hardware.
[env:d1_mini_usb]
platform = espressif8266
board = d1_mini
framework = arduino
upload_protocol = esptool
upload_port = /dev/cu.usbserial-10
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	lennarthennigs/ESP Telnet@^2.3.0
	bblanchon/ArduinoJson@^7
